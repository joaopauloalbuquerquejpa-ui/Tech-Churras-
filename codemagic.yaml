workflows:
  ios-testflight:
    name: Tech Churras — iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: tech_churras_asc
    environment:
      groups:
        - ios_signing
      vars:
        BUNDLE_ID: com.techchurras.app
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 20
      xcode: latest
    triggering:
      events: []
    scripts:
      - name: Instalar dependências do frontend
        script: |
          cd frontend
          npm ci
      - name: Sincronizar Capacitor (webDir estático — app roda via server.url em produção)
        script: |
          cd frontend
          npx cap sync ios
      - name: Configurar assinatura automática (App Store Connect API key)
        script: |
          xcode-project use-profiles
      - name: Build e arquivamento do IPA
        script: |
          cd frontend
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Testers Tech Churras
